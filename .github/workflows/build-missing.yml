name: Build missing shards locally, then fresh kernel replay

# One attempt on a single GitHub runner: restore every shard the Omega
# Institute has published, compile the unpublished rest with Lake, replay
# Main with `leanchecker --fresh`, audit the axioms. Likely to hit the
# 6-hour job limit; the log tail and exit code are recorded either way.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-missing.yml']
  workflow_dispatch:

concurrency:
  group: rh-build-missing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: read
    steps:
      - name: Check out the Omega Institute verifier
        uses: actions/checkout@v4
        with:
          repository: the-omega-institute/riemann-hypothesis
          ref: main
          path: omega
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost || true
          df -h /

      - name: Install elan and zstd
        run: |
          curl --fail --silent --show-error --location --retry 3 https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y zstd

      - name: Restore published shards, compile the rest, replay, audit
        working-directory: omega
        timeout-minutes: 340
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/out/omega_commit.txt"
          start=$(date -u +%FT%TZ)
          rc=0
          python3 ./verify --build-missing Main > "$GITHUB_WORKSPACE/out/build.log" 2>&1 || rc=$?
          echo "started=$start finished=$(date -u +%FT%TZ) exit_code=$rc" > "$GITHUB_WORKSPACE/out/FINAL"

      - name: Collect results (also after timeout or failure)
        if: always()
        working-directory: omega
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          [ -f "$GITHUB_WORKSPACE/out/FINAL" ] || echo "finished=$(date -u +%FT%TZ) exit_code=none (job stopped or timed out)" > "$GITHUB_WORKSPACE/out/FINAL"
          cp .lake/parts/axioms.txt "$GITHUB_WORKSPACE/out/axioms.txt" 2>/dev/null || echo "no axioms.txt produced" > "$GITHUB_WORKSPACE/out/axioms.txt"
          tail -n 300 "$GITHUB_WORKSPACE/out/build.log" > "$GITHUB_WORKSPACE/out/build_tail.log" 2>/dev/null || true
          rm -f "$GITHUB_WORKSPACE/out/build.log"
          free -g >> "$GITHUB_WORKSPACE/out/FINAL"; df -h / >> "$GITHUB_WORKSPACE/out/FINAL"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-missing-results
          path: out/
          if-no-files-found: ignore

  record:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-missing-results
          path: incoming
        continue-on-error: true
      - name: Commit results
        run: |
          mkdir -p results-build-missing
          cp -r incoming/. results-build-missing/ 2>/dev/null || true
          echo "${{ needs.build.result }}" > results-build-missing/job_result.txt
          date -u +%FT%TZ > results-build-missing/recorded_at.txt
          git config user.name "rh-verify-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results-build-missing
          git commit -m "Build-missing run $(date -u +%FT%TZ)" || exit 0
          git pull --rebase
          git push
